services:
  - type: web
    name: ai-infra-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_JSON
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-infra-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: ai-infra-db
    plan: free
    region: oregon
    databaseName: ai_infra_failure_prediction
    user: ai_infra_user
