apiVersion: apps/v1
kind: Deployment
metadata:
  name: aifp-api
  labels:
    app: aifp-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aifp-api
  template:
    metadata:
      labels:
        app: aifp-api
    spec:
      containers:
        - name: api
          image: ai-infra-failure-prediction-api:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aifp-secrets
            - configMapRef:
                name: aifp-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aifp-api
spec:
  selector:
    app: aifp-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aifp-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aifp-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
